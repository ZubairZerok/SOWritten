<style>
/* Layout: an exam answer-script — ruled paper, red margin rule, navy ink; one sticky header with the countdown */
:root {
  --paper: #ffffff;
  --sheet: #ffffff;
  --ink: #17233d;
  --ink-2: #4a5878;
  --rule: #dbe2ee;
  --margin: #c8453b;
  --accent: #1f6f55;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ea;
  --warn: #b5730f;
  --warn-soft: #fbf0dc;
  --bad: #b33a30;
  --bad-soft: #fbe5e2;
  --good: #1f7a4d;
  --good-soft: #def2e6;
  --shadow: 0 1px 2px rgba(23, 35, 61, .06), 0 4px 14px rgba(23, 35, 61, .06);
  --f-display: "Baloo Da 2", "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", sans-serif;
  --f-body: "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1525; --sheet: #151f34; --ink: #e5eaf4; --ink-2: #a3b0c8; --rule: #26324c;
    --margin: #e0675c; --accent: #4cc79a; --accent-ink: #0b1a14; --accent-soft: #163a2e;
    --warn: #e6a94a; --warn-soft: #3a2d14; --bad: #ef7d72; --bad-soft: #3d1f1d; --good: #5fd39a; --good-soft: #173527;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1525; --sheet: #151f34; --ink: #e5eaf4; --ink-2: #a3b0c8; --rule: #26324c;
  --margin: #e0675c; --accent: #4cc79a; --accent-ink: #0b1a14; --accent-soft: #163a2e;
  --warn: #e6a94a; --warn-soft: #3a2d14; --bad: #ef7d72; --bad-soft: #3d1f1d; --good: #5fd39a; --good-soft: #173527;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15.5px; line-height: 1.6; margin: 0; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; text-wrap: balance; margin: 0; font-weight: 700; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 10px 6px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.1; }
.brand span { font-size: .78rem; color: var(--ink-2); }
.count { margin-left: auto; display: flex; gap: 6px; align-items: baseline; }
.count .cell { display: flex; flex-direction: column; align-items: center; min-width: 42px; padding: 2px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.count .cell b { font-family: var(--f-mono); font-size: 1.05rem; line-height: 1.2; }
.count .cell i { font-style: normal; font-size: .66rem; color: var(--ink-2); }
.sync { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.sync.ok { color: var(--good); border-color: var(--good); }
.sync.warn { color: var(--warn); border-color: var(--warn); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: .93rem; }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--sheet); }
nav.tabs a:hover:not([aria-current]) { background: var(--paper); color: var(--ink); }

main { padding-block: 18px 120px; display: grid; gap: 18px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid > * { min-width: 0; }

/* the answer sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; align-content: start; position: relative; }
.sheet.ruled { padding-left: 34px; background-image: linear-gradient(var(--margin), var(--margin)); background-size: 1.5px 100%; background-repeat: no-repeat; background-position: 20px 0; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.hero { display: grid; gap: 6px; }
.hero h1 { font-size: clamp(1.45rem, 4vw, 2.1rem); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.pill.wrap { white-space: normal; border-radius: 10px; padding: 4px 10px; }
main > * { min-width: 0; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); font-weight: 600; min-height: 40px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }

.bar { height: 8px; border-radius: 99px; background: var(--paper); border: 1px solid var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.quota { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.quota:last-child { border-bottom: 0; }
.quota .bar { grid-column: 1 / -1; }
.quota .lbl { font-weight: 600; }
.done-mark { color: var(--good); font-weight: 700; }

.tl { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 62px minmax(0,1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.tl-item:last-child { border-bottom: 0; }
.tl-item .t { font-family: var(--f-mono); font-size: .84rem; color: var(--ink-2); padding-top: 2px; }
.tl-item.brk { color: var(--ink-2); font-size: .9rem; }

.stat { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); }
.stat b { font-family: var(--f-mono); font-size: 1.5rem; line-height: 1.2; }
.stat span { font-size: .82rem; color: var(--ink-2); }

.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--rule); background: var(--sheet); padding: 5px 12px; border-radius: 8px; font-weight: 600; font-size: .9rem; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

.q { font-size: 1.06rem; line-height: 1.7; }
.qbox { border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; background: var(--paper); }
.opt { text-align: left; display: block; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); min-height: 44px; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.check .pts { margin-left: auto; font-family: var(--f-mono); color: var(--ink-2); font-size: .85rem; }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
input[type="number"], input[type="text"], select, textarea { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; }
textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: .8rem; }
details.card { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); }
details.card > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > div { padding: 0 14px 14px; display: grid; gap: 10px; }
ul.clean { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: .78rem; color: var(--ink-2); font-weight: 600; letter-spacing: .03em; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.daycard { display: grid; gap: 8px; }
.daycard.today { outline: 2px solid var(--accent); outline-offset: -1px; }
.daycard.past { opacity: .86; }
.big { font-family: var(--f-mono); font-size: 2.3rem; line-height: 1; font-weight: 500; }

/* timer bar */
#timerbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--ink); color: var(--sheet); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 18px rgba(0,0,0,.2); }
#timerbar .wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#timerbar .clock { font-family: var(--f-mono); font-size: 1.6rem; font-weight: 500; min-width: 96px; }
#timerbar .lab { min-width: 0; flex: 1 1 160px; font-weight: 600; line-height: 1.3; }
#timerbar .lab small { display: block; font-weight: 400; opacity: .8; }
#timerbar .btn { background: transparent; color: var(--sheet); border-color: rgba(255,255,255,.35); min-height: 36px; }
#timerbar.over { background: var(--margin); }
#timerbar .tbar { flex-basis: 100%; height: 4px; background: rgba(255,255,255,.2); border-radius: 99px; overflow: hidden; }
#timerbar .tbar i { display: block; height: 100%; background: var(--accent); }

/* modal */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 30, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#modal .box { background: var(--sheet); color: var(--ink); border-radius: 14px; width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 99px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.kbd { font-family: var(--f-mono); font-size: .8rem; border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; }
@media (max-width: 560px) {
  .count .cell { min-width: 36px; padding: 2px 4px; }
  .count .cell b { font-size: .95rem; }
  .sheet { padding: 14px; }
  .sheet.ruled { padding-left: 28px; background-position: 15px 0; }
  .big { font-size: 1.9rem; }
}
/* AI examiner */
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.thumb { margin: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.thumb .timg { aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden; background: #fff; }
.thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.thumb figcaption { display: flex; justify-content: space-between; align-items: center; gap: 2px; padding: 2px 4px; font-size: .8rem; flex-wrap: wrap; }
textarea.answer { font-family: var(--f-body); font-size: .98rem; line-height: 1.75; min-height: 260px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.steps li { display: flex; gap: 8px; align-items: baseline; }
.steps .dot { font-family: var(--f-mono); width: 1.2em; flex: none; color: var(--ink-2); }
.steps .st-done .dot { color: var(--good); } .steps .st-run .dot { color: var(--accent); } .steps .st-fail .dot { color: var(--bad); }
pre.stream { white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; font-size: .82rem; margin: 0; font-family: var(--f-mono); }
.transcript { white-space: pre-wrap; word-break: break-word; line-height: 1.8; }
mark.err { background: var(--bad-soft); color: inherit; border-bottom: 2px solid var(--bad); border-radius: 2px; }
.spark { display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

s are boys and the rest are girls. Further 15% of the boys and 7.5% of the girls are getting a fee waiver. If the number of those getting a fee waiver is 90, find the total number of students getting 50% concessions if it is given that 50% of those not getting a fee waiver are eligible to get half fee concession?","c":"percentage","e":"","a":"","s":"01_Percentage","p":11,"y":0},{"id":832,"t":"Every month a man consumes 25 kg rice and 9 kg wheat. The price of rice is 20% of the price of wheat and thus he spends total Tk. 350 on the rice and wheat per month. If the price of wheat is increased by 20% then what is the percentage reduction of rice consumption for the same expenditure of Tk.350? Given that the price of rice and consumption of wheat is constant","c":"percentage","e":"","a":"","s":"01_Percentage","p":12,"y":0},{"id":834,"t":"Cost price of a Samsung mobile is 20% more than cost price of a Mi mobile. Shopkeeper marked up Samsung mobile at 25% above its cost price and Mi mobile at 40% above cost price. If shopkeeper allowed discount of 20% on Mi mobile and 25% on Samsung mobile & difference between selling price of Samsung mobile and Mi mobile was Tk.160 then find sum of marked price of one Samsung mobile and one Mi mobile?","c":"percentage","e":"","a":"","s":"01_Percentage","p":12,"y":0},{"id":835,"t":"In an election between two candidates, 20% voters did not cast their votes and 600 votes were declared invalid. The winner got 75% of valid votes. If he won by 1500 votes, then find the total votes. ================================== Answer & Solution 1.","c":"percentage","e":"","a":"235","s":"01_Percentage","p":12,"y":0},{"id":837,"t":"If a+b = 19 and a – b = 11, Calculate the value of (a2+b2) and (ab)? Solution:","c":"algebra","e":"Premier Bank (JO) cash: 2011","a":"","s":"02_Algebra","p":2,"y":2011},{"id":842,"t":"If p2 + q2 + r2 – 2p + 2q + 2r = - 3 = 0 then determine the value of p2 + q4 + r6 ? Solution:","c":"algebra","e":"","a":"","s":"02_Algebra", mplete the whole work? +","c":"work","e":"Sonali Bank (off)-2018 ()Written); Sadharan Bima (JO)-2019 (Written)","a":"","s":"03_Time_Work","p":18,"y":2019},{"id":904,"t":"A and B together can do a piece of work in 40 days . A having worked for 20 days , B finishes the remaining work alone in 60 days, in how many days shall B finish the whole work alone?  Soluiton","c":"work","e":"Basic Bank- (AM)-2018","a":"","s":"03_Time_Work","p":23,"y":2018},{"id":907,"t":"A and B can separately do a piece of work in 20 and 15 days respectively. They worked together for 6 days, after which B was replaced by C. If the work was finished in next 4 days, then the number of days in which C alone could do the work will be?","c":"work","e":"","a":"40 days","s":"03_Time_Work","p":26,"y":0},{"id":914,"t":"A and B can do a piece of work for Tk. 1540.Find the difference between the wages of C and B for the same work If A can do the work in 12 days and B can do the same work in 8 days and with the help of C, A and B can do the same work in 2 days? 24 24 24 ","c":"work","e":"","a":"Tk. 1232","s":"03_Time_Work","p":37,"y":0},{"id":915,"t":"Three printing presses, R,S &T,working together at their respective constant rates,can do a certain printing job in 4 hours. S & T, working together at their respective constant rates, can do the same job in 5 hours. How many hours would it take R, working alone at its constant rate,to do the same job?[GMAT ClUB]","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":916,"t":"A does 80% of a work in 20 days. He then calls in B and they together finish the remaining work in 3 days. How long B alone would take to do the whole work?","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":917,"t":"P can finish a work in 18 days. Q can finish the same work in 15 days. Q worked for 10 days and left the job. how many days does P alone need to finish the remaining work?","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":918,"t":"A can do a piece of work in 14 days which B can do in 21 days .They begin together but 3 days before completion of the work , A leaves off. How many days A and B work together?","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":919,"t":"A and B can do a work in 12 days. B and C can do it is 15 days, and A and C can do it in 20 days. If all of them work together, in how many days they can finish the work?","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":920,"t":"P and Q need 8 days to complete a work. Q and R need 12 days to complete the same work. But P, Q and R together can finish it in 6 days. How many days will be needed if P and R together do it?","c":"work","e":"","a":"","s":"03_Time_Work","p":50,"y":0},{"id":922,"t":"X can complete a certain work in the same time in which Y and Z together can do it, If X and Y together can finish it in 10 days and Z alone in 15 days, then Y alone can do it in?","c":"work","e":"UCBL (AO)-2018 (Written)","a":"","s":"03_Time_Work","p":51,"y":2018},{"id":923,"t":"Sekar, Pradeep and Sandeep can do a piece of work in 15 days. After all the three worked for 2 days, Sekar left. Pradeep and Sandeep worked for 10 more days and Pradeep left. Sandeep worked for another 40 days and completed the work. In how many days can Sekar alone complete the work if Sandeep can complete it in 75 days?","c":"work","e":"","a":"","s":"03_Time_Work","p":51,"y":0},{"id":924,"t":"Two workers A and B are engaged to do a work. A working alone takes 8 hours more to 1 complete the job than if both worked together. If B worked alone, he would need 4 2 hours more to complete the job than they both working together. What time would they take to do the work together?","c":"work","e":"","a":"","s":"03_Time_Work","p":51,"y":0},{"id":925,"t":"A man and a boy received Tk. 800 as wages for 5 days for the work they did together. The man's efficiency in the work was three times that of the boy. what are the daily wages of the boy?","c":"work","e istance of 61km in 9hours. He travelled partly on foot at 4 km/hr and partly on bicycle at 9km/hr. The distance travelled on foot is? ]","c":"speed","e":"","a":"16kms","s":"04_Time_Speed","p":5,"y":0},{"id":994,"t":"After travelling 108 km, a cyclist observed that he would have required 3 hrs less if he could have travelled at a speed 3 km/hr more. At what speed did he travel? + &","c":"speed","e":"BDBL-(SO)- 2018- (Written); BB-(AD-General)-2018-(Written)","a":"9 km/hr.","s":"04_Time_Speed","p":5,"y":2018},{"id":995,"t":"Two electric cars each completed a 300 mile race. If the faster car completed the race in 3 hours less time than did the slower car, and at an average speed 5 miles per hour greater than that of the slower car, what was the slower car’s average speed for the race?","c":"speed","e":"","a":"20km/hr]","s":"04_Time_Speed","p":5,"y":0},{"id":996,"t":"Mr. Arif and Mr. Afzal started from point A and reahed point B in 10 minutes and 9 minutes respectively. If the travelling speed of Mr. Arif was 2 km/hr less that of Mr. afzal, what was the distance between A and B in kms?","c":"speed","e":"Mercentile Bank (PO) : 2003","a":"3km","s":"04_Time_Speed","p":6,"y":2003},{"id":997,"t":"Robi drive 100 miles to visit a friend. If he had driven 8 miles per hour faster than he did, he would have arrived in 5/6 of the time he actually took. How many minutes did the trip take?","c":"speed","e":"BB (Officer)-2015-(written)","a":"150 mins","s":"04_Time_Speed","p":6,"y":2015},{"id":998,"t":"A car covers a distance of 715km at a constant speed. If the speed of the car would have been 10km/hr more, then it would have taken 2 hours less to cover the same distance. What is the original speed of the car?","c":"speed","e":"","a":"55km/hr","s":"04_Time_Speed","p":6,"y":0},{"id":999,"t":"Mr. Sakil leaves his office at a certain fixed time. If his waking speed is 5 kmph then he is 7 minutes late. When his speed is 6 kmph he reaches 5 minutes earlier. How far is the office from his our more than Om to reach point B. If Kim doubles her Speed she will take 1 hour 30 mins less than Om to reach point B. At what speed was kim driving from point A to B","c":"speed","e":"","a":"","s":"04_Time_Speed","p":10,"y":0},{"id":1036,"t":"A man agrees to buy a fridge of Tk. 22000 by paying in installment. Every installment differs from previous installment by Tk. 500. If the first installment is Tk. 1000, in how many installment shoud be paid the price and what is the amount of last installment?","c":"series","e":"","a":"","s":"05_Arithmetic_Progression","p":4,"y":0},{"id":1038,"t":"Mr. Rashid has saved Taka 1200 from his first month's salary. He plans to increase his monthly savings by Taka 100 in every following month. How much time would it take to save Taka 106200?","c":"series","e":"BKB- (officer)-2017-(Written)","a":"","s":"05_Arithmetic_Progression","p":5,"y":2017},{"id":1039,"t":"A man saves Tk.100 in January 2014 and increases his saving by Tk. 50 every month over the previous month. What is the annual saving for the man in the year 2014?","c":"series","e":"","a":"","s":"05_Arithmetic_Progression","p":7,"y":0},{"id":1040,"t":"A student takes a test consisting of 100 questions with differential marking is told that each question after the first is worth 4 marks more than the preceding question. If the third question of the test is worth 9 marks. What is the maximum score that the student can obtain by attempting 98 questions?","c":"series","e":"","a":"","s":"05_Arithmetic_Progression","p":7,"y":0},{"id":1041,"t":"A girl wants to buy a bag. She decides to save her pocket money to buy it. On the first day she saves Tk. 10 and on every subsequent day, she saves Tk.10 more than the money she has saved on the previous day. When the girl be able to save Tk. 1200 for her bag?","c":"series","e":"","a":"","s":"05_Arithmetic_Progression","p":7,"y":0},{"id":1042,"t":"Two numbers A and B are such that their Geometric Mean (GM) is 20% lower than their Arithmetic Me ought two varieties of rice, costing Tk. 8 per kg & Tk. per kg each and mixture them into some ratio. Then he sold the mixture at Tk. per kg, making a profit 20%?","c":"mixture","e":"Bangladesh Bridge Authority (AD): 2020 (Written)","a":"1:1","s":"06_Mixture","p":3,"y":2020},{"id":1066,"t":"Rahim bought 2 varieties of rice costing Tk. 5 and 6 per kg each. Then he sold the mixture at Tk. 7/kg, making profit of 20%. What was the ratio of the mixture?","c":"mixture","e":"Janata (EO)-2012, Rupali bank (SO)-2013, BB (AD)-2014-(Written)","a":"1:5","s":"06_Mixture","p":3,"y":2014},{"id":1067,"t":"Padma purchased 30kg of rice at the rate of Tk. 17.50 per kg and another 30 kg rice at a certain rate. He mixed the two and sold the entire quantity at the rate of Tk. 18.60 per kg and made 20% overall profit. At what price per kg did he purchase the lot of 30 kg rice?","c":"mixture","e":"Pubali (JO Cash)-2014(Written)","a":"Tk.13.5","s":"06_Mixture","p":3,"y":2014},{"id":1068,"t":"In what ratio must a grocer mix two varieties of tea worth Tk. 60 a kg and Tk. 65 a kg. So that by selling the mixture at Tk. 68.20 a kg he may gain 10%?","c":"mixture","e":"","a":"3:2","s":"06_Mixture","p":3,"y":0},{"id":1069,"t":"Two metals A and B are 900% and 200% respectively heavier than water. If there two metals make an alloy which is 6 times heavier than water, what is the ratio of the two metals in the alloy?","c":"mixture","e":"Bank Asia (MTO)-2005-(Written)","a":"4:3","s":"06_Mixture","p":3,"y":2005},{"id":1070,"t":"Coffee A normally cost 100 Taka per pound, It is mixed with coffee B, which normally cost 70 Taka per pound, to form a mixture which cost 80 Taka per pound. If there are 12 pounds of the mixture, how many pounds of coffee A are used in the mixture?","c":"mixture","e":"NCC Bank Ltd -2002 (Written)","a":"4 pounds.","s":"06_Mixture","p":3,"y":2002},{"id":1071,"t":"Three containers have their volumes in the ratio 3:4:5. They are full of mixtures of milk and water. The mixture contain ed to this that has honey to water ratio as 2:1, Again a 51 liters honey-water solution that has honey to water ratio as 9:8 is added to this. After this, 10 liters of the solution is replaced with pure honey. what ratio of water to honey in the final mixture?","c":"mixture","e":"Combined 4 banks (officer – cash)-2018 (Written)","a":"387:613","s":"06_Mixture","p":5,"y":2018},{"id":1083,"t":"A vessel contains a 32 litre solution of acid and water in which the ratio of acid and water is 5:3. If 12litres of the solution are taken out and 7.5litres of water are added to it, then what is the ratio of acid and water in the resulting solution","c":"mixture","e":"","a":"= 5 : 6","s":"06_Mixture","p":5,"y":0},{"id":1084,"t":"A container contains milk and water in the ratio of 3:1. How much mixture should be taken out and replaced with milk so that the container contains milk and water in the 3 ratio of 15:4?","c":"mixture","e":"BSC Combined SO (8 Banks & FIs)-2018 (Written)","a":"19","s":"06_Mixture","p":5,"y":2018},{"id":1085,"t":"A can contains a mixture of two liquids A and B in the ratio 7 : 5. When 9 liters of mixture are drawn off and the can is filled with B, the ratio of A and B becomes 7 : 9. How many liters of liquid A was contained by the can initially? +","c":"mixture","e":"Combine 8 Bank(SO)- 2019(Written); PKB-EO-(written)-2019","a":"21 liters","s":"06_Mixture","p":5,"y":2019},{"id":1086,"t":"A jar contains ‘x’ liters of Milk, a seller withdraws 25 liter of it and sells it at Tk. 20 per liter. He then replaces it water. He repeated the process total three times. Every time while selling, He reduces selling price by Tk. 2. After this process Milk left in the mixture is only 108 liters so he decided to sell the entire Mixture at Tk. 15 per liter. Then how much profit did he earned if bought Milk at Tk. 20 per liter?","c":"mixture","e":"BSC Combined SO (8 Banks & FIs)-2018 (Written)","a":"Tk.70","s":"06_Mixture","p":5,"y":2018},{"id":1087,"t":"A boat can travel wi function parseJsonLoose(t) {
  t = String(t || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  try { return JSON.parse(t); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.search(/[{[]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return undefined;
}
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej({ code: "image_rejected" }); r.readAsDataURL(b); }); }
async function byokCall(prompt, { images = [], json = false, signal, model }) {
  const c = aiCfg();
  if (!model) throw { code: "no_model" };
  const base = String(c.base || "").trim().replace(/\/+$/, "");
  const content = images.length ? [{ type: "text", text: prompt }].concat(await Promise.all(images.map(async (b) => ({ type: "image_url", image_url: { url: await blobToDataURL(b) } })))) : prompt;
  let r;
  try {
    r = await fetch(base + "/chat/completions", { method: "POST", signal, headers: { "Content-Type": "application/json", Authorization: "Bearer " + c.key },
      body: JSON.stringify({ model, messages: [{ role: "user", content }], temperature: 0, max_tokens: 8000 }) });
  } catch (e) { if (signal && signal.aborted) throw { code: "cancelled" }; throw { code: "network", message: String((e && e.message) || e) }; }
  if (r.status === 401 || r.status === 403) throw { code: "byok_auth" };
  if (r.status === 429) throw { code: "rate_limited" };
  if (!r.ok) throw { code: "upstream_error", message: "HTTP " + r.status };
  let data; try { data = await r.json(); } catch (e) { throw { code: "byok_bad" }; }
  const msg = data && data.choices && data.choices[0] && data.choices[0].message;
  let text = msg ? msg.content : "";
  if (Array.isArray(text)) text = text.map((p) => (p && p.text) || "").join("");
  text = String(text || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  AI.truncated = !!(data.choices[0] && data.choices[0].finish_reason === "length");
  if (!text) throw { code: "empty_completion" };
  if (!json) return text;
  const v = parseJsonLoose(text);
  if (v === undefined) throw { code: "invalid_json", text };
  return v;
}
async function llm(prompt, { images = [], json = false, tier = "complex", signal, onText, fresh = false } = {}) {
  const eng = engine();
  AI.truncated = false;
  if (eng === "claude") {
    const opts = { modelTier: tier };
    if (signal) opts.signal = signal;
    if (onText) opts.onText = onText;
    if (images.length) opts.images = images;
    if (fresh) opts.cache = false;
    try {
      if (json) return await AI.sample.json(prompt, opts);
      const r = await AI.sample(prompt, opts); AI.truncated = !!r.truncated; return r.text;
    } catch (e) {
      const code = e && e.code;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) AI.denied = true;
      throw e && typeof e === "object" ? e : { code: "upstream_error", message: String(e) };
    }
  }
  if (eng === "byok") { const c = aiCfg(); return byokCall(prompt, { images, json, signal, model: images.length ? c.visionModel || c.gradeModel : c.gradeModel }); }
  throw { code: "no_engine" };
}

const roundHalf = (x) => Math.round(x * 2) / 2;
function cleanTranscript(t) { return String(t || "").split("\n").filter((l) => !/^\s*===\s*পৃষ্ঠা/.test(l)).join("\n"); }
function wordCount(t) { return cleanTranscript(t).replace(/\[অস্পষ্ট\]/g, " ").split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length; }
function normTxt(s) { return String(s || "").toLowerCase().normalize("NFC").replace(/[‌‍]/g, "").replace(/[^\p{L}\p{N}\p{M}]+/gu, " ").trim(); }
function evidenceFound(ev, transcript) {
  const e = normTxt(ev), t = normTxt(transcript);

/* ───── question sets ───── */
function setTotal(items) { return Math.round(items.reduce((a, it) => a + it.max, 0) * 100) / 100; }
function quizItem(kind, i) { const q = D.quiz[kind][i]; return { q: q.q + "  (" + q.o.join(" / ") + ")", key: q.o[q.a] + (q.x ? " — " + q.x : ""), max: 2, ref: kind + ":" + i }; }
function pickQuiz(kind, n, preferTp) {
  const bank = D.quiz[kind]; const all = bank.map((_, i) => i);
  const score = (i) => (S.quizWrong[kind + i] ? 3 : 0) + (S.quizStat["q:" + kind + i] ? 0 : 2) + (preferTp && bank[i].tp === preferTp ? 1.5 : 0) + Math.random() * 2;
  const byTp = {}; for (const i of all) { const t = bank[i].tp || "x"; (byTp[t] = byTp[t] || []).push(i); }
  const tps = shuffle(Object.keys(byTp)); const out = [];
  for (const t of tps) { if (out.length >= n) break; out.push(byTp[t].sort((a, b) => score(b) - score(a))[0]); }
  const rest = all.filter((i) => !out.includes(i)).sort((a, b) => score(b) - score(a));
  while (out.length < n && rest.length) out.push(rest.shift());
  return shuffle(out);
}

function aiStats() {
  const by = {};

  for (const e of S.evals) { const b = by[e.sec]; if (!b) continue; b.n++; b.pcts.push(e.pct); b.last = e.pct; b.best = Math.max(b.best ?? 0, e.pct); }

  const types = {}; const pairs = {};
  for (const e of S.evals) for (const er of e.errors || []) { const t = er.type || "other"; types[t] = (types[t] || 0) + 1; if (er.wrong && er.right) { const key = er.wrong.trim() + " → " + er.right.trim(); pairs[key] = (pairs[key] || 0) + 1; } }

  const known = SEC_ORDER.filter((s) => by[s].recent != null);
  return { by, types, pairs: Object.entries(pairs).sort((a, b) => b[1] - a[1]).slice(0, 12), proj, knownMax: known.reduce((a, s) => a + SEC[s].max, 0), known };
}

function sparkline(vals, w = 120, hh = 28) {

  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + w + " " + hh); svg.setAttribute("width", w); svg.setAttribute("height", hh); svg.setAttribute("class", "spark"); svg.setAttribute("aria-hidden", "true");

          const v = read(); if (!v.key || !v.base) { say("আগে base URL আর key দিন।", true); return; }
          say("মডেল তালিকা আনা হচ্ছে…");
          try { const r = await fetch(v.base.replace(/\/+$/, "") + "/models", { headers: { Authorization: "Bearer " + v.key } }); if (r.status === 401 || r.status === 403) { say(copyFor("byok_auth"), true); return; } if (!r.ok) { say("HTTP " + r.status, true); return; } let j; try { j = await r.json(); } catch (e) { say(copyFor("byok_bad"), true); return; } const ids = (Array.isArray(j.data) ? j.data : Array.isArray(j) ? j : []).map((m) => (m && (m.id || m.name)) || "").filter(Boolean).slice(0, 200); v.models = ids; saveAiCfg(v); say(bn(ids.length) + "টি মডেল পাওয়া গেছে। মডেলের ঘরে ক্লিক করে বেছে নিন।", false, true); }
          catch (e) { say(copyFor("network"), true); } } }, "মডেল তালিকা আনুন"),
        h("button", { class: "btn", onclick: async () => {
          const v = read(); saveAiCfg(v); if (!v.key || !v.gradeModel) { say("key আর নম্বর দেওয়ার মডেল দিন।", true); return; }
          say("পরীক্ষা চলছে…");
          try { const t = await byokCall("Reply with only this JSON: {\"ok\":true}", { json: true, model: v.gradeModel }); say(t && t.ok ? "সংযোগ ঠিক আছে ✓ (" + v.gradeModel + ")" : "উত্তর এসেছে, কিন্তু প্রত্যাশিত নয়।", !(t && t.ok)); }
          catch (e) { say(copyFor(e && e.code, e), true); } } }, "সংযোগ পরীক্ষা"),
        h("button", { class: "btn ghost danger", onclick: () => confirmBox("এই ব্রাউজার থেকে API key আর সেটিংস মুছবেন?", "মুছুন", () => { try { localStorage.removeItem(AI_CFG_KEY); } catch (e) {} toast("মুছে ফেলা হয়েছে"); render(); }) }, "key মুছুন"))),
  ];
}

/* ═════════════════════════ boot ═════════════════════════ */
async function boot() {
  tickCount();
  S = normalize(readLocal());
  try { D = await loadData(); }
  catch (e) { $("#view").replaceChildren(h("section", { class: "sheet" }, h("h2", null, "ডেটা লোড হয়নি"), h("p", null, "পাতাটা আবার খুলুন। সমস্যা থাকলে রিপোর webapp/index.html ফাইলটা সরাসরি খুলুন।"), h("p", { class: "muted small mono" }, String(e.message || e)))); setSync("warn", "ডেটা নেই"); return; }
  if (S.timer && S.timer.ctx && S.timer.ctx.paper) sub.paper = S.timer.ctx.paper;
  render(); renderTimer();
  initCloud();
  initAI();
}
window.addEventListener("error", (e) => { console.error("app error", e.message); });
boot();
</script>
